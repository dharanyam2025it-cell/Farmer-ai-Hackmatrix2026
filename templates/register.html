<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Farmer AI - Register</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;

    background:
        linear-gradient(
            180deg,
            rgba(225, 247, 255, 0.72),
            rgba(246, 243, 232, 0.92)
        ),
        url("{{ url_for('static', filename='images/bg.jpg') }}")
        center / cover fixed;
}

        .register-card {
    width: 90%;
    max-width: 420px;
    background: rgba(255, 253, 246, 0.96);
    padding: 35px;
    border-radius: 22px;
    box-shadow: 0 18px 40px rgba(24, 32, 24, 0.18);
}

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 14px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2e7d32;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1b5e20;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #2e7d32;
            text-decoration: none;
            font-weight: bold;
        }

        .message {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 8px;
            background: #fff3cd;
            color: #664d03;
        }
    </style>
</head>

<body>

<div class="register-card">

    <h1>🌱 Farmer AI</h1>

    <p class="subtitle">
        Create your account
    </p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('register') }}">

        <label for="name">
            Name
        </label>

        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your name"
            required
        >

        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a password"
            required
        >

        <button type="submit">
            Create Account
        </button>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="{{ url_for('login') }}">
            Login
        </a>
    </div>

</div>

</body>
</html>
