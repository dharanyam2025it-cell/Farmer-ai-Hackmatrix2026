<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer AI - Login</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;

    background:
        linear-gradient(
            180deg,
            rgba(225, 247, 255, 0.72),
            rgba(246, 243, 232, 0.92)
        ),
        url("{{ url_for('static', filename='images/bg.jpg') }}")
        center / cover fixed;
}
    .login-container {
        width: 100%;
        max-width: 430px;
    }

    .login-card {
    width: 90%;
    max-width: 420px;
    background: rgba(255, 253, 246, 0.96);
    padding: 35px;
    border-radius: 22px;
    box-shadow: 0 18px 40px rgba(24, 32, 24, 0.18);
}

    .logo {
        width: 85px;
        height: 85px;
        margin: 0 auto 18px;
        border-radius: 50%;
        background: #e8f5e9;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 45px;
    }

    h1 {
        color: #2e7d32;
        font-size: 30px;
        margin-bottom: 8px;
    }

    .subtitle {
        color: #666;
        font-size: 15px;
        margin-bottom: 28px;
    }

    .flash-message {
        padding: 12px 15px;
        border-radius: 10px;
        margin-bottom: 18px;
        font-size: 14px;
    }

    .flash-success {
        background: #e8f5e9;
        color: #2e7d32;
    }

    .flash-error {
        background: #ffebee;
        color: #c62828;
    }

    .form-group {
        text-align: left;
        margin-bottom: 18px;
    }

    .form-group label {
        display: block;
        font-weight: 600;
        color: #333;
        margin-bottom: 7px;
        font-size: 14px;
    }

    .form-group input {
        width: 100%;
        padding: 14px 15px;
        border: 1px solid #d5d5d5;
        border-radius: 12px;
        font-size: 15px;
        outline: none;
        transition: 0.2s;
    }

    .form-group input:focus {
        border-color: #43a047;
        box-shadow: 0 0 0 3px rgba(67, 160, 71, 0.12);
    }

    .login-btn {
        width: 100%;
        border: none;
        padding: 14px;
        border-radius: 12px;
        background: #2e7d32;
        color: white;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        margin-top: 5px;
        transition: 0.2s;
    }

    .login-btn:hover {
        background: #1b5e20;
        transform: translateY(-1px);
    }

    .register-text {
        margin-top: 22px;
        color: #666;
        font-size: 14px;
    }

    .register-text a {
        color: #2e7d32;
        font-weight: 700;
        text-decoration: none;
    }

    .register-text a:hover {
        text-decoration: underline;
    }

    .back-home {
        display: inline-block;
        margin-top: 18px;
        color: #777;
        text-decoration: none;
        font-size: 13px;
    }

    .back-home:hover {
        color: #2e7d32;
    }

    @media (max-width: 480px) {
        .login-card {
            padding: 30px 22px;
        }

        h1 {
            font-size: 26px;
        }
    }
</style>

</head>

<body>

<div class="login-container">

<div class="login-card">

    <div class="logo">
        🌱
    </div>

    <h1>Farmer AI</h1>

    <p class="subtitle">
        Login to your agricultural assistant
    </p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash-message
                    {% if category == 'success' %}
                        flash-success
                    {% else %}
                        flash-error
                    {% endif %}
                ">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="{{ url_for('login') }}" method="POST">

        <div class="form-group">
            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
                autocomplete="email"
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
                autocomplete="current-password"
            >
        </div>

        <button
            type="submit"
            class="login-btn"
        >
            Login
        </button>

    </form>

    <p class="register-text">
        Don't have an account?
        <a href="{{ url_for('register') }}">
            Register
        </a>
    </p>

    <a
        href="{{ url_for('login') }}"
        class="back-home"
    >
        🌾 Farmer AI
    </a>

</div>

</div>

</body>
</html>
