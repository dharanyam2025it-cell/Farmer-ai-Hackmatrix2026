<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer AI - Login</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html,
    body {
        width: 100%;
        min-height: 100%;
    }

    body {
        min-height: 100vh;
        min-height: 100dvh;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #e8f5e9, #f1f8e9, #ffffff);

        display: flex;
        justify-content: center;
        align-items: center;

        padding: 20px;
    }

    .login-container {
        width: 100%;
        max-width: 430px;
        margin: auto;
    }

    .login-card {
        width: 100%;
        background: white;
        border-radius: 24px;
        padding: 38px 32px;
        box-shadow: 0 15px 45px rgba(0, 0, 0, 0.12);
        text-align: center;
    }

    .logo {
        width: 85px;
        height: 85px;
        margin: 0 auto 18px;
        border-radius: 50%;
        background: #e8f5e9;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 45px;
    }

    h1 {
        color: #2e7d32;
        font-size: 30px;
        margin-bottom: 8px;
    }

    .subtitle {
        color: #666;
        font-size: 15px;
        margin-bottom: 28px;
        line-height: 1.5;
    }

    .flash-message {
        padding: 12px 15px;
        border-radius: 10px;
        margin-bottom: 18px;
        font-size: 14px;
        line-height: 1.4;
    }

    .flash-success {
        background: #e8f5e9;
        color: #2e7d32;
    }

    .flash-error {
        background: #ffebee;
        color: #c62828;
    }

    .form-group {
        width: 100%;
        text-align: left;
        margin-bottom: 18px;
    }

    .form-group label {
        display: block;
        font-weight: 600;
        color: #333;
        margin-bottom: 7px;
        font-size: 14px;
    }

    .form-group input {
        display: block;
        width: 100%;
        height: 48px;

        padding: 0 15px;

        border: 1px solid #d5d5d5;
        border-radius: 12px;

        font-size: 15px;
        outline: none;

        background: #fff;

        transition: 0.2s;
    }

    .form-group input:focus {
        border-color: #43a047;
        box-shadow: 0 0 0 3px rgba(67, 160, 71, 0.12);
    }

    .login-btn {
        display: block;
        width: 100%;
        height: 50px;

        border: none;
        border-radius: 12px;

        background: #2e7d32;
        color: white;

        font-size: 16px;
        font-weight: 700;

        cursor: pointer;

        margin-top: 5px;
    }

    .login-btn:hover {
        background: #1b5e20;
    }

    .register-text {
        margin-top: 22px;
        color: #666;
        font-size: 14px;
        line-height: 1.5;
    }

    .register-text a {
        color: #2e7d32;
        font-weight: 700;
        text-decoration: none;
    }

    .register-text a:hover {
        text-decoration: underline;
    }

    .back-home {
        display: inline-block;
        margin-top: 18px;
        color: #777;
        text-decoration: none;
        font-size: 13px;
    }

    .back-home:hover {
        color: #2e7d32;
    }


    /* ============================= */
    /* MOBILE */
    /* ============================= */

    @media (max-width: 600px) {

        body {
            padding: 16px;
            align-items: center;
        }

        .login-container {
            width: 100%;
            max-width: 380px;
        }

        .login-card {
            width: 100%;
            padding: 30px 22px;
            border-radius: 20px;
        }

        .logo {
            width: 70px;
            height: 70px;
            font-size: 36px;
            margin-bottom: 14px;
        }

        h1 {
            font-size: 26px;
        }

        .subtitle {
            font-size: 14px;
            margin-bottom: 22px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group input {
            height: 48px;
            font-size: 16px;
        }

        .login-btn {
            height: 50px;
            font-size: 16px;
        }
    }


    /* ============================= */
    /* SMALL PHONES */
    /* ============================= */

    @media (max-width: 380px) {

        body {
            padding: 12px;
        }

        .login-card {
            padding: 25px 18px;
        }

        .logo {
            width: 62px;
            height: 62px;
            font-size: 32px;
        }

        h1 {
            font-size: 24px;
        }

        .subtitle {
            font-size: 13px;
        }
    }
</style>


</head>

<body>

<div class="login-container">

<div class="login-card">

    <div class="logo">
        🌱
    </div>

    <h1>Farmer AI</h1>

    <p class="subtitle">
        Login to your agricultural assistant
    </p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash-message
                    {% if category == 'success' %}
                        flash-success
                    {% else %}
                        flash-error
                    {% endif %}
                ">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="{{ url_for('login') }}" method="POST">

        <div class="form-group">
            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
                autocomplete="email"
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
                autocomplete="current-password"
            >
        </div>

        <button
            type="submit"
            class="login-btn"
        >
            Login
        </button>

    </form>

    <p class="register-text">
        Don't have an account?
        <a href="{{ url_for('register') }}">
            Register
        </a>
    </p>

    <a
        href="{{ url_for('login') }}"
        class="back-home"
    >
        🌾 Farmer AI
    </a>

</div>

</div>

</body>
</html>
